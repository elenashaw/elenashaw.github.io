<title>Leetcode-Note</title>
<style>
  :root {
    --bg: #ffffff; --card-bg: #ffffff; --text-main: #1f2328; --text-muted: #59636e;
    --border: #d0d7de; --link: #0969da; --code-bg: #f6f8fa; --radius: 6px;
  }
  body { margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Roboto,sans-serif;
         background:var(--bg); color:var(--text-main); line-height:1.75; }
  .topbar { background:#ffffff; border-bottom:1px solid var(--border); padding:14px 24px;
            display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .topbar a { color:var(--text-main); text-decoration:none; font-size:.9rem; }
  .topbar a:hover { color:var(--link); text-decoration:underline; }
  .topbar .spacer { flex:1; }
  .container { max-width:860px; margin:30px auto 60px; padding:0 20px; }
  article { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
            padding:28px 32px; }
  article h1 { border-bottom:1px solid var(--border); padding-bottom:10px; font-size:1.7rem; }
  article h2 { margin-top:1.6em; padding-bottom:6px; border-bottom:1px solid #eaeef2; }
  article h3 { margin-top:1.4em; }
  article img { max-width:100%; border:1px solid var(--border); border-radius:var(--radius); }
  article code { background:var(--code-bg); color:#1f2328; padding:2px 6px; border-radius:4px; font-size:.92em; }
  article pre { background:#f6f8fa; border:1px solid var(--border); padding:14px 18px; border-radius:var(--radius); overflow-x:auto; }
  article pre code { background:none; color:inherit; padding:0; }
  article blockquote { border-left:4px solid #d0d7de; margin:1em 0; padding:4px 16px; color:var(--text-muted); }
  article table { border-collapse:collapse; width:100%; margin:1em 0; font-size:.95rem; }
  article th, article td { border:1px solid var(--border); padding:6px 12px; text-align:left; }
  article th { background:#f6f8fa; }
  article a { color:var(--link); }
  .missing-img { background:#f6f8fa; color:#59636e; padding:2px 10px; border-radius:4px;
                 font-size:.85rem; border:1px dashed #d0d7de; display:inline-block; margin:2px 0; }
  .card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:20px; }
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;
          text-decoration:none; color:inherit; transition:border-color .15s; display:flex; flex-direction:column; gap:8px; }
  .card:hover { border-color:var(--link); }
  .card h3 { margin:0; font-size:1.05rem; color:var(--text-main); }
  .card p { margin:0; color:var(--text-muted); font-size:.88rem; line-height:1.6; }
  .card .meta { font-size:.75rem; color:var(--text-muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .page-title { font-size:1.6rem; font-weight:600; margin:10px 0 4px; }
  .page-sub { color:var(--text-muted); font-size:.95rem; margin-bottom:8px; }
  footer { text-align:center; padding:30px 20px; color:var(--text-muted); font-size:.85rem; border-top:1px solid #eaeef2; }
</style>
